  viewBox="0 0 1100 640"
  width="1100"
  height="640"
  role="img"
  font-family="Microsoft YaHei UI, Noto Sans SC, system-ui, sans-serif"
>
  <title>JobHunter · 系统架构图</title>
  <desc>
    CLI/Web 两个入口装配 recruitment、user、matching、common 四个共享模块。matching
    通过公开只读快照关联招聘与用户事实，common
    提供通用运行能力。箭头表示运行时协作，不表示代码导入关系。
  </desc>
