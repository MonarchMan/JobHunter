      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b6472" />
    </marker>
  </defs>
  <rect width="1100" height="640" rx="12" fill="#f9fafb" />
